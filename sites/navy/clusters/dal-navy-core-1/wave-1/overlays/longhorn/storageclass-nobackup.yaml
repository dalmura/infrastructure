kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: cluster-nobackup
  # No recurringJobSelector: Longhorn applies the "default" recurring-job group
  # (including daily-filesystem-trim) to volumes with no explicit job labels.
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: "best-effort"
  fsType: ext4
