apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-test-1-postgres
spec:
  configuration:
    destinationPath: "s3://dal-site-backups/navy/cnpg-test/postgres/"
    s3Credentials:
      accessKeyId:
        name: cnpg-test-db-backup
        key: access_key
      secretAccessKey:
        name: cnpg-test-db-backup
        key: secret_key
    data:
      compression: gzip
    wal:
      compression: gzip
    tags:
      site: navy
      service: cnpg-test
      db: cnpg-test-1-db
  retentionPolicy: "2d"
