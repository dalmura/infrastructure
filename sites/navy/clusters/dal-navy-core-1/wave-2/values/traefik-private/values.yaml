global:
  checkNewVersion: false
  sendAnonymousUsage: false

deployment:
  revisionHistoryLimit: 0

resources:
  requests:
    cpu: 25m
    memory: 96Mi

ingressClass:
  name: ingress-private

providers:
  kubernetesCRD:
    ingressClass: ingress-private
    allowCrossNamespace: true
  kubernetesIngress:
    ingressClass: ingress-private
    publishedService:
      enabled: true

ports:
  web:
    port: 80
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    asDefault: true
    port: 443
  traefik:
    port: 8080
    expose:
      default: true
  ssh:
    port: 22
    expose:
      default: true

service:
  annotations:
    metallb.io/address-pool: servers-vlan
    metallb.io/loadBalancerIPs: 192.168.81.11
  spec:
    externalTrafficPolicy: Local

additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
  - "--api.insecure=true"
  - "--metrics.prometheus=true"
