apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: todo-postgres
spec:
  configuration:
    destinationPath: "s3://dal-site-backups/navy/todo/postgres/"
    s3Credentials:
      accessKeyId:
        name: todo-db-backup-secret
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: todo-db-backup-secret
        key: SECRET_ACCESS_KEY
    data:
      compression: gzip
    wal:
      compression: gzip
    tags:
      site: navy
      service: todo
      db: todo-db
  retentionPolicy: "10d"
