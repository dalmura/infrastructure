global:
  enabled: true

injector:
  # Maybe later, using ESO for now
  enabled: false

server:
  resources:
    requests:
      cpu: 10m
      memory: 128Mi

  ingress:
    enabled: false

  readinessProbe:
    enabled: true
    path: "/v1/sys/health?standbyok=true&sealedcode=200&uninitcode=200"

ha:
  apiAddr: https://vault.navy.dalmura.cloud
  clusterAddr: https://cluster.vault.navy.dalmura.cloud

ui:
  enabled: true
  publishNotReadyAddresses: true
