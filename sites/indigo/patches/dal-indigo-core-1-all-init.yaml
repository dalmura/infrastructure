---
apiVersion: v1alpha1
kind: KubeNodeConfig
nodeIP:
  validSubnets:
    - 192.168.77.0/25

labels:
  topology.kubernetes.io/region: "melbourne"
  topology.kubernetes.io/zone: "indigo"
  k8s.dalmura.cloud/nodegroup: "<K8S_NODE_GROUP>"
  node.kubernetes.io/instance-type: "<NODE_INSTANCE_TYPE>"

---
apiVersion: v1alpha1
kind: HostnameConfig
hostname: "talos-<HW_ADDRESS>"
auto:
  $patch: delete

---
apiVersion: v1alpha1
kind: ResolverConfig
nameservers:
  - address: 192.168.77.1
  - address: 192.168.77.129
hostDNS:
  enabled: true
  forwardKubeDNSToHost: true

---
apiVersion: v1alpha1
kind: KubeletConfig
# containerd images, container logs and Longhorn replicas all share the /var
# filesystem (default-data-path is /var/lib/longhorn/). Longhorn reserves 25%
# of that disk via storage-minimal-available-percentage, so the kubelet default
# 85/80 image GC band only starts cleaning up after Longhorn has already marked
# the disk unschedulable. Prune earlier and also drop stale tags by age.
config:
  imageGCHighThresholdPercent: 70
  imageGCLowThresholdPercent: 60
  imageMinimumGCAge: 5m
  # Remove images unused for 30 days regardless of disk pressure.
  imageMaximumGCAge: 720h
