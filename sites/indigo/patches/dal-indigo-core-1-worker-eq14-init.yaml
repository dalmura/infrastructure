machine:
  network:
    interfaces:
      - interface: bond0

        bond:
          interfaces:
            - "enp1s0"
            - "enp2s0"
            #- "enx<HW_ADDRESS_P1>"
            #- "enx<HW_ADDRESS_P2>"
          mode: 802.3ad
          lacpRate: fast
          xmitHashPolicy: "layer3+4"
          miimon: 100

        dhcp: false
        addresses:
          - "<NODE_IP>/25"
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.77.129
            metric: 2048

        vlans:
          - # SERVERS
            vlanId: 103
            dhcp: false
            addresses:
              - "<VLAN_IP>/25"
            routes:
              - network: 0.0.0.0/0
                gateway: 192.168.77.1
                metric: 1024

  install:
    image: <INSTALLER_IMAGE_URI>

    diskSelector:
      size: ">= 500GB"

  sysctls:
    # Required for Longhorn V2 Data Engine
    vm.nr_hugepages: "1024"

  kernel:
    modules:
      # Required for Longhorn V2 Data Engine
      - name: nvme_tcp
      - name: vfio_pci

  udev:
    rules:
      # Required for Plex transcoding
      - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
