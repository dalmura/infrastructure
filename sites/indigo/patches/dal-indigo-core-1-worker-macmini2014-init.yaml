machine:
  network:
    interfaces:
      - interface: "enx<HW_ADDRESS>"
        dhcp: false
        addresses:
          - "<NODE_IP>/25"
        routes:
          - network: 0.0.0.0/0
            gateway: 192.168.77.129
            metric: 2048

        vlans:
          - # SERVERS
            vlanId: 103
            dhcp: false
            addresses:
              - "<VLAN_IP>/25"
            routes:
              - network: 0.0.0.0/0
                gateway: 192.168.77.1
                metric: 1024

  install:
    image: <INSTALLER_IMAGE_URI>

    diskSelector:
      size: ">= 200GB"

  sysctls:
    # Required for Longhorn V2 Data Engine
    vm.nr_hugepages: "1024"

  kernel:
    modules:
      # Required for Longhorn V2 Data Engine
      - name: nvme_tcp
      - name: vfio_pci

  udev:
    rules:
      # Required for Plex transcoding
      - SUBSYSTEM=="drm", KERNEL=="renderD*", GROUP="44", MODE="0660"
