---
podAnnotations:
  reloader.stakater.com/auto: "true"

resources:
  requests:
    cpu: 50m
    memory: 384Mi

grafana.ini:
  server:
    root_url: "https://grafana.indigo.dalmura.cloud"
    domain: "grafana.indigo.dalmura.cloud"

deploymentStrategy:
  type: Recreate

persistence:
  enabled: true
  size: 10Gi
  storageClassName: cluster-nobackup
