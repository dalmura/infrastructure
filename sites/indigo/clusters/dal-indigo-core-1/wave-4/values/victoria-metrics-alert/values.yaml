---
nameOverride: vma

server:
  strategy:
    type: Recreate
    rollingUpdate: null

  resources:
    requests:
      cpu: 10m
      memory: 32Mi

  extraArgs:
    external.label: "cluster=dal-indigo-core-1"

  datasource:
    url: http://victoria-metrics-single-vms-server.victoria-metrics.svc.cluster.local:8428

  notifier:
    url: http://victoria-metrics-alert-vma-alertmanager.victoria-metrics.svc.cluster.local:9093

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: dalmura-letsencrypt-prod
      external-dns.kubernetes.io/hostname: vma.indigo.dalmura.cloud
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
    hosts:
      - name: vma.indigo.dalmura.cloud
        path:
          - /
        port: http
    ingressClassName: ingress-private
    tls:
      - hosts:
          - vma.indigo.dalmura.cloud
        secretName: vma-cert

  config:
    alerts:
      groups:
        #- name: test-alert-group
        #  rules:
        #    - alert: TestAlert
        #      expr: "2 > 1"
        #      labels:
        #        severity: critical
        #      annotations:
        #        summary: "This is a Test Alert"
        #        description: "A Test Alert designed to verify Slack comms"
        - name: longhorn
          rules:
            - alert: LonghornVolumeFull
              expr: "((avg by (volume, pvc, pvc_namespace) (longhorn_volume_actual_size_bytes)) / (avg by (volume, pvc, pvc_namespace) (longhorn_volume_capacity_bytes))) * 100 > 95"
              labels:
                severity: critical
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is >95% full"
                description: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is >95% full, either reclaim space or expand volume."

            - alert: LonghornVolumeBackupStale
              expr: |
                (time() - max by (volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at)) / 3600 > 25
                and
                max by (volume, pvc, pvc_namespace) (longhorn_volume_last_backup_at) > 0
              labels:
                severity: critical
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has no recent backup"
                description: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has not been successfully backed up for {{ $value | printf \"%.1f\" }} hours. The daily recurring backup job may be failing."

            - alert: LonghornBackupFailed
              expr: max by (volume, backup, recurring_job) (longhorn_backup_state) == 4
              for: 10m
              labels:
                severity: critical
              annotations:
                summary: "Longhorn backup {{ $labels.backup }} failed"
                description: "Longhorn backup {{ $labels.backup }} for volume {{ $labels.volume }} (recurring job {{ $labels.recurring_job }}) is in the Error state. Check the Longhorn UI backup page and the longhorn-manager logs."

            - alert: LonghornMetricsScrapeFailing
              expr: up{job="longhorn"} == 0
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Longhorn metrics scrape failing on {{ $labels.instance }}"
                description: "VictoriaMetrics has been unable to scrape the Longhorn manager on {{ $labels.instance }} for more than 15 minutes. Longhorn alerts may be incomplete or unable to fire."

            - alert: LonghornVolumeFaulted
              expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="faulted"}) == 1
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is faulted"
                description: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been in the faulted state for more than 5 minutes. Data may be unavailable; check the volume and replica status in the Longhorn UI."

            - alert: LonghornVolumeDegraded
              expr: max by (volume, pvc, pvc_namespace) (longhorn_volume_robustness{state="degraded"}) == 1
              for: 15m
              labels:
                severity: warning
              annotations:
                summary: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} is degraded"
                description: "Longhorn volume {{ $labels.pvc_namespace }}/{{ $labels.pvc }} has been degraded for more than 15 minutes. One or more replicas may be rebuilding or unavailable, so redundancy is reduced."

            - alert: LonghornNodeNotReady
              expr: max by (node) (longhorn_node_status{condition="ready"}) == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Longhorn node {{ $labels.node }} is not ready"
                description: "Longhorn node {{ $labels.node }} has reported not ready for more than 5 minutes. Volumes with replicas on this node may be degraded."

            - alert: LonghornDiskUnhealthy
              expr: max by (node, disk) (longhorn_disk_health) == 0
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Longhorn disk {{ $labels.disk }} on {{ $labels.node }} is unhealthy"
                description: "Longhorn disk {{ $labels.disk }} on node {{ $labels.node }} has been reported unhealthy for more than 10 minutes. Check SMART data and the disk status in the Longhorn UI."

        - name: postgresql-cnpg
          rules:
            - alert: PostgresWALArchivingStalled
              expr: |
                (time() - cnpg_pg_stat_archiver_last_archived_time > 3600)
                and
                (cnpg_collector_pg_wal_archive_status{value="ready"} > 0)
              labels:
                severity: critical
              annotations:
                summary: "Postgres continuous WAL archiving stalled on cluster {{ $labels.cnpg_cluster }}"
                description: "Postgres cluster {{ $labels.cnpg_cluster }} in namespace {{ $labels.namespace }} has not successfully archived a WAL segment to S3/Barman for over 1 hour. Immediate action is required to ensure backup recoverability."

            - alert: PostgresNoSuccessfulBackup
              expr: |
                (time() - (barman_cloud_cloudnative_pg_io_last_available_backup_timestamp or cnpg_collector_last_available_backup_timestamp) > 90000)
                and
                (lifetime(cnpg_cluster_instances[30d]) > 86400)
              labels:
                severity: critical
              annotations:
                summary: "Postgres cluster {{ $labels.cnpg_cluster }} has no successful full backup"
                description: "Postgres cluster {{ $labels.cnpg_cluster }} in namespace {{ $labels.namespace }} has not had a successful full backup in the last 25 hours. Nightly backup jobs may have failed."

            - alert: PostgresBackupRetentionFailing
              expr: |
                (time() - (barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_cluster="authentik-db"} or cnpg_collector_first_recoverability_point{cnpg_cluster="authentik-db"}) > 86400 * 14)
                or
                (time() - (barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_cluster="forgejo-db"} or cnpg_collector_first_recoverability_point{cnpg_cluster="forgejo-db"}) > 86400 * 10)
                or
                (time() - (barman_cloud_cloudnative_pg_io_first_recoverability_point{cnpg_cluster="emojirades-db"} or cnpg_collector_first_recoverability_point{cnpg_cluster="emojirades-db"}) > 86400 * 5)
              labels:
                severity: warning
              annotations:
                summary: "Postgres cluster {{ $labels.cnpg_cluster }} backup retention is failing"
                description: "Postgres cluster {{ $labels.cnpg_cluster }} in namespace {{ $labels.namespace }} is retaining backups older than its retention policy window. First recoverability point is older than expected, indicating that older backups are not being successfully pruned/deleted from S3."


            - alert: PostgresClusterDegraded
              expr: "cnpg_cluster_instances < cnpg_cluster_instances_target"
              labels:
                severity: critical
              annotations:
                summary: "Postgres cluster {{ $labels.cnpg_cluster }} is degraded"
                description: "Postgres cluster {{ $labels.cnpg_cluster }} in namespace {{ $labels.namespace }} has {{ $value }} ready instances, but targets {{ $labels.cnpg_cluster_instances_target }}. Redundancy is reduced."

            - alert: PostgresConnectionsFillingUp
              expr: |
                (sum by (cnpg_cluster, namespace) (cnpg_backends_total{cnpg_cluster="authentik-db"}) > 240)
                or
                (sum by (cnpg_cluster, namespace) (cnpg_backends_total{cnpg_cluster!~"authentik-db"}) > 80)
              labels:
                severity: critical
              annotations:
                summary: "Postgres cluster {{ $labels.cnpg_cluster }} connections are filling up"
                description: "Postgres cluster {{ $labels.cnpg_cluster }} in namespace {{ $labels.namespace }} has {{ $value }} active connections, approaching maximum connection limits. Immediate action is required to avoid query rejection."

        - name: node-health
          rules:
            - alert: HostDown
              expr: up{job="node-exporter"} == 0
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Host {{ $labels.instance }} is down"
                description: "Node exporter on {{ $labels.instance }} has been unreachable for more than 5 minutes."

            - alert: HostHighCpuLoad
              expr: 100 - (avg by (instance) (rate(node_cpu_seconds_total{mode="idle"}[5m])) * 100) > 90
              for: 10m
              labels:
                severity: warning
              annotations:
                summary: "Host {{ $labels.instance }} high CPU load"
                description: "CPU load on {{ $labels.instance }} is {{ $value | printf \"%.2f\" }}% (above 90%) for the last 10 minutes."

            - alert: HostOutOfMemory
              expr: (1 - (node_memory_MemAvailable_bytes / node_memory_MemTotal_bytes)) * 100 > 90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Host {{ $labels.instance }} low memory"
                description: "Available memory on {{ $labels.instance }} is low ({{ $value | printf \"%.2f\" }}% used) for the last 5 minutes."

            - alert: HostOutOfDiskSpace
              expr: (1 - (node_filesystem_free_bytes{fstype!~"tmpfs"} / node_filesystem_size_bytes{fstype!~"tmpfs"})) * 100 > 90
              for: 5m
              labels:
                severity: critical
              annotations:
                summary: "Host {{ $labels.instance }} disk space almost full"
                description: "Disk usage on {{ $labels.instance }} mount {{ $labels.mountpoint }} is {{ $value | printf \"%.2f\" }}% (above 90%) for the last 5 minutes."


alertmanager:
  enabled: true

  resources:
    requests:
      cpu: 10m
      memory: 48Mi

  ingress:
    enabled: true
    annotations:
      cert-manager.io/cluster-issuer: dalmura-letsencrypt-prod
      external-dns.kubernetes.io/hostname: alert-manager.indigo.dalmura.cloud
      traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
      traefik.ingress.kubernetes.io/router.tls: "true"
      traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
    hosts:
      - name: alert-manager.indigo.dalmura.cloud
        path:
          - /
        port: web
    ingressClassName: ingress-private
    tls:
      - hosts:
          - alert-manager.indigo.dalmura.cloud
        secretName: alert-manager-cert

  #securityContext:
  #  enabled: true
  #  fsGroup: 65534

  podSecurityContext:
    enabled: true
    fsGroup: 65534
    fsGroupChangePolicy: OnRootMismatch

  persistentVolume:
    enabled: true
    size: 100Mi
    storageClassName: cluster-nobackup

  baseURL: "https://alert-manager.indigo.dalmura.cloud/"

  config:
    global:
      slack_api_url_file: /slack/webhook.txt

    route:
      receiver: dalmura-infra-slack
      group_by:
        - alertname
        - namespace
        - cnpg_cluster
        - instance
        - pvc

    receivers:
      - name: dalmura-infra-slack
        slack_configs:
          - send_resolved: true
            channel: '#infrastructure'
            username: 'Indigo Alerts'
            icon_emoji: 'warning'
            title: >-
              {{ if eq .Status "firing" }}[FIRING:{{ .Alerts.Firing | len }}]{{ else }}[RESOLVED]{{ end }} {{ if eq (len .Alerts) 1 }}{{ (index .Alerts 0).Annotations.summary }}{{ else }}{{ .CommonLabels.alertname }}{{ if .CommonLabels.cnpg_cluster }} ({{ .CommonLabels.cnpg_cluster }}){{ else if (index .Alerts 0).Labels.cnpg_cluster }} ({{ range $i, $a := .Alerts }}{{ if $i }}, {{ end }}{{ $a.Labels.cnpg_cluster }}{{ end }}){{ else if .CommonLabels.instance }} ({{ .CommonLabels.instance }}){{ else if (index .Alerts 0).Labels.instance }} ({{ range $i, $a := .Alerts }}{{ if $i }}, {{ end }}{{ $a.Labels.instance }}{{ end }}){{ end }}{{ end }}


  extraVolumes:
    - name: slack-config
      secret:
        secretName: alert-manager-slack-config

  extraVolumeMounts:
    - name: slack-config
      mountPath: /slack
      readOnly: true
