apiVersion: traefik.io/v1alpha1
kind: Middleware
metadata:
  name: security-headers
spec:
  headers:
    # HSTS: Forces HTTPS
    stsIncludeSubdomains: true
    stsPreload: true
    stsSeconds: 31536000
    forceSTSHeader: true

    # Clickjacking Protection
    frameDeny: true
    customFrameOptionsValue: "SAMEORIGIN"

    # MIME Sniffing: Prevent browser from guessing content type
    contentTypeNosniff: true

    # Disable deprecated XSS filter (modern standard to avoid client-side side-channel vulnerabilities)
    customBrowserXSSValue: "0"

    # Permissions Policy: Restrict sensitive browser features
    permissionsPolicy: "camera=(), microphone=(), geolocation=()"

    # Referrer Policy: Limit referrer header to same-origin
    referrerPolicy: "same-origin"

    # Information Disclosure: Strip the Server header
    customResponseHeaders:
      Server: ""
