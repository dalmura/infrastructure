global:
  checkNewVersion: false
  sendAnonymousUsage: false

deployment:
  replicas: 2
  revisionHistoryLimit: 0
  lifecycle:
    preStop:
      sleep:
        seconds: 15
  additionalVolumes:
    - name: crowdsec-bouncer
      secret:
        secretName: crowdsec-bouncer
        optional: true

additionalVolumeMounts:
  - name: crowdsec-bouncer
    mountPath: /etc/crowdsec
    readOnly: true

resources:
  requests:
    cpu: 50m
    memory: 128Mi

affinity:
  podAntiAffinity:
    preferredDuringSchedulingIgnoredDuringExecution:
      - weight: 100
        podAffinityTerm:
          labelSelector:
            matchLabels:
              app.kubernetes.io/name: '{{ template "traefik.name" . }}'
              app.kubernetes.io/instance: '{{ .Release.Name }}-{{ include "traefik.namespace" . }}'
          topologyKey: kubernetes.io/hostname

ingressClass:
  name: ingress-public

providers:
  kubernetesCRD:
    ingressClass: ingress-public
    allowCrossNamespace: true
    defaultTLSResourcesNamespace: traefik-public
  kubernetesIngress:
    ingressClass: ingress-public
    publishedService:
      enabled: true

ports:
  web:
    port: 80
    http:
      aliasHeadersStrategy: delete
      sanitizePath: true
      redirections:
        entryPoint:
          to: websecure
          scheme: https
  websecure:
    asDefault: true
    port: 443
    http:
      aliasHeadersStrategy: delete
      sanitizePath: true
  traefik:
    port: 8080
    expose:
      default: false
      dashboard: true
  plex:
    port: 32406
    expose:
      default: true

service:
  annotations:
    metallb.io/address-pool: servers-vlan
    metallb.io/loadBalancerIPs: 192.168.77.11
  spec:
    externalTrafficPolicy: Local
  additionalServices:
    dashboard:
      spec:
        type: ClusterIP

additionalArguments:
  - "--serversTransport.insecureSkipVerify=true"
  - "--api.insecure=true"
  - "--metrics.prometheus=true"

experimental:
  plugins:
    geoblock:
      moduleName: github.com/PascalMinder/geoblock
      # renovate: datasource=github-tags depName=PascalMinder/geoblock
      version: v0.3.8
    bouncer:
      moduleName: github.com/maxlerebourg/crowdsec-bouncer-traefik-plugin
      # renovate: datasource=github-tags depName=maxlerebourg/crowdsec-bouncer-traefik-plugin
      version: v1.7.1
