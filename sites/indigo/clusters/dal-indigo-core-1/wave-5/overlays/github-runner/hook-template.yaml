apiVersion: v1
kind: ConfigMap
metadata:
  name: github-runner-hook-template
data:
  # Pod template applied by actions/runner-container-hooks to the job pods it
  # creates when containerMode is enabled. Keeping it here means job pods stay
  # on the amd64 workers and do not receive a Kubernetes ServiceAccount token.
  extension: |
    spec:
      automountServiceAccountToken: false
      nodeSelector:
        kubernetes.io/arch: amd64
