apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: obsidian-mcp-env
  namespace: obsidian-mcp
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  secretStoreRef:
    name: site
    kind: SecretStore

  refreshPolicy: Periodic
  refreshInterval: 1h

  target:
    name: obsidian-mcp-env
    creationPolicy: Owner
    deletionPolicy: Retain

  data:
    - secretKey: LIVESYNC_COUCH_URI
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_COUCH_URI

    - secretKey: LIVESYNC_COUCH_DBNAME
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_COUCH_DBNAME

    - secretKey: LIVESYNC_COUCH_USER
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_COUCH_USER

    - secretKey: LIVESYNC_COUCH_PASSWORD
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_COUCH_PASSWORD

    # End-to-end encryption settings. These must match the values in use by the
    # Obsidian plug-in (Settings => Self-hosted LiveSync => Remote Configuration).
    # A mismatch in any of these silently produces missing or duplicate notes.
    - secretKey: LIVESYNC_PASSPHRASE
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_PASSPHRASE

    - secretKey: LIVESYNC_PATH_NORMALIZATION_VERSION
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_PATH_NORMALIZATION_VERSION

    - secretKey: LIVESYNC_USE_PATH_OBFUSCATION
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_USE_PATH_OBFUSCATION

    - secretKey: LIVESYNC_HANDLE_FILENAME_CASE_SENSITIVE
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: LIVESYNC_HANDLE_FILENAME_CASE_SENSITIVE

    # Bearer token Hermes uses to reach the MCP server.
    - secretKey: MCP_API_KEY
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: MCP_API_KEY
