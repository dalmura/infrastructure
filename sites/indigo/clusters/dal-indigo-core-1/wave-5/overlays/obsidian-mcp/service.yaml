apiVersion: v1
kind: Service
metadata:
  labels:
    app.kubernetes.io/instance: obsidian-mcp
    app.kubernetes.io/name: obsidian-mcp
  name: obsidian-mcp
  namespace: obsidian-mcp
spec:
  ipFamilyPolicy: SingleStack
  ports:
    - name: http
      port: 8000
      protocol: TCP
      targetPort: http
    - name: http-rw
      port: 8001
      protocol: TCP
      targetPort: http-rw
  selector:
    app.kubernetes.io/instance: obsidian-mcp
    app.kubernetes.io/name: obsidian-mcp
  type: ClusterIP
