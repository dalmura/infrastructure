---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: ha-matter
  annotations:
    cert-manager.io/cluster-issuer: dalmura-letsencrypt-prod
    external-dns.kubernetes.io/hostname: ha-matter.indigo.dalmura.cloud
    traefik.ingress.kubernetes.io/router.entrypoints: web,websecure
    traefik.ingress.kubernetes.io/router.tls: true
    traefik.ingress.kubernetes.io/router.middlewares: authentik-authentik@kubernetescrd
spec:
  ingressClassName: ingress-private
  tls:
    - hosts:
      - ha-matter.indigo.dalmura.cloud
      secretName: home-assistant-matter-cert
  rules:
  - host: ha-matter.indigo.dalmura.cloud
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: matter-server
            port:
              name: websocket
