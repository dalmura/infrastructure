apiVersion: v1
kind: Service
metadata:
  name: hermes-mcp
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
spec:
  ipFamilyPolicy: SingleStack
  ports:
    # mcp-http sidecar: mcp-proxy (Streamable HTTP at /mcp) in front of
    # `hermes mcp-serve`. Reached only through the traefik-public UUID router.
    - name: mcp
      port: 8765
      protocol: TCP
      targetPort: mcp
  selector:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
  type: ClusterIP
