apiVersion: v1
kind: Service
metadata:
  name: hermes-tasks
  labels:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
spec:
  ipFamilyPolicy: SingleStack
  ports:
    # mcp-tasks sidecar: the kanban MCP shim (create_task / list_tasks /
    # get_task / board_status / list_assignees) behind mcp-proxy. Reached only through the
    # traefik-public sealed-UUID router.
    - name: tasks
      port: 8770
      protocol: TCP
      targetPort: tasks
  selector:
    app.kubernetes.io/name: hermes-agent
    app.kubernetes.io/instance: hermes
  type: ClusterIP
