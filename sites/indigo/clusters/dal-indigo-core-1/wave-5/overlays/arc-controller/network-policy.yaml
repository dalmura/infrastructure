apiVersion: cilium.io/v2
kind: CiliumNetworkPolicy
metadata:
  name: arc-controller
  namespace: arc-systems
spec:
  endpointSelector:
    matchLabels:
      app.kubernetes.io/name: gha-rs-controller
      app.kubernetes.io/component: controller-manager
  egress:
    # Allow DNS
    - toEndpoints:
        - matchLabels:
            io.kubernetes.pod.namespace: kube-system
            k8s-app: kube-dns
      toPorts:
        - ports:
            - port: "53"
              protocol: ANY
          rules:
            dns:
              - matchPattern: "*"
    # Allow managing AutoscalingRunnerSet, listener, and runner resources
    - toEntities:
        - kube-apiserver
    # The controller, not the listener, creates the runner scale set and
    # requests installation access tokens from the GitHub API. Without this
    # rule the reconcile times out with "context deadline exceeded".
    # api.github.com is the only GitHub host the controller calls; github.com
    # is included for redirects and future API changes.
    - toFQDNs:
        - matchName: "api.github.com"
        - matchName: "github.com"
      toPorts:
        - ports:
            - port: "443"
              protocol: TCP
