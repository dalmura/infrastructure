apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: matrix-postgres
spec:
  configuration:
    destinationPath: "s3://dal-site-backups/indigo/matrix/postgres/"
    s3Credentials:
      accessKeyId:
        name: matrix-db-backup
        key: access_key
      secretAccessKey:
        name: matrix-db-backup
        key: secret_key
    data:
      compression: gzip
    wal:
      compression: gzip
    tags:
      site: indigo
      service: matrix
      db: matrix-db
  retentionPolicy: "3d"
