apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: archestra-credentials
spec:
  secretStoreRef:
    name: site
    kind: SecretStore

  refreshPolicy: Periodic
  refreshInterval: 1h

  target:
    name: archestra-auth
    template:
      engineVersion: v2
      data:
        auth-secret: "{{ .auth_secret }}"
        session-secret: "{{ .session_secret }}"
        secrets-encryption-secret: "{{ .secrets_encryption_secret }}"
        admin-password: "{{ .admin_password }}"

  data:
  - secretKey: auth_secret
    remoteRef:
      key: wave-5/archestra/config
      property: auth_secret
  - secretKey: session_secret
    remoteRef:
      key: wave-5/archestra/config
      property: session_secret
  - secretKey: secrets_encryption_secret
    remoteRef:
      key: wave-5/archestra/config
      property: secrets_encryption_secret
  - secretKey: admin_password
    remoteRef:
      key: wave-5/archestra/config
      property: admin_password
