apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: archestra-postgres
spec:
  configuration:
    destinationPath: "s3://dal-site-backups/indigo/archestra/postgres/"
    s3Credentials:
      accessKeyId:
        name: archestra-db-backup
        key: access_key
      secretAccessKey:
        name: archestra-db-backup
        key: secret_key
    data:
      compression: gzip
    wal:
      compression: gzip
    tags:
      site: indigo
      service: archestra
      db: archestra-db
  retentionPolicy: "3d"
