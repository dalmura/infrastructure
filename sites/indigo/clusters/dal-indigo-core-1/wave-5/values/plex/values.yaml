---
ingress:
  enabled: false

image:
  # renovate: datasource=docker depName=plexinc/pms-docker
  tag: "1.43.7.11114-4b588ea35"

pms:
  configStorage: 100Gi
  securityContext:
    # Required for hardware transcoding support
    privileged: true

  claimSecret:
    name: plex-secrets
    key: PLEX_CLAIM

  resources:
    requests:
      cpu: 250m
      memory: 450Mi
    limits:
      # Plex butler tasks (deep media analysis) peak at ~3.4 cores, which
      # saturated this 4-core node and tripped HostHighCpuLoad. Cap it so the
      # node stays under ~75% and co-tenants (authentik-db, matrix) have room.
      # Memory is deliberately unlimited: 30d peak is ~2.3GiB with no pressure.
      cpu: 2500m

service:
  port: 32406

serviceAccount:
  create: true

extraEnv:
  # Video GID for transcoding device access
  PLEX_GID: "44"
  # Container timezone. Plex also derives its Butler (scheduled task) window
  # from this, so the window itself is 06:00-08:00 local time. That range is
  # deliberately clear of the 03:00-05:30 backup band (CNPG + Longhorn).
  TZ: "Australia/Melbourne"

nodeSelector:
  k8s.dalmura.cloud/nodegroup: eq14-worker-pool

extraVolumeMounts:
  - name: dev-dri
    mountPath: /dev/dri
  - name: data
    mountPath: /data

extraVolumes:
  # Required for hardware transcoding support
  - name: dev-dri
    hostPath:
      path: /dev/dri
      type: Directory
  - name: data
    nfs:
      server: atlas.wlanding.dalmura.com.au
      path: /data
      readOnly: true
