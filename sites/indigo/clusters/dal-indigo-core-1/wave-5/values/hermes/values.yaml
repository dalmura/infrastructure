fullnameOverride: hermes

image:
  repository: nousresearch/hermes-agent
  # renovate: datasource=docker depName=nousresearch/hermes-agent
  tag: v0.23.4
  pullPolicy: IfNotPresent

replicaCount: 1

controller:
  type: deployment

serviceAccount:
  create: true
  name: hermes
  # The agent does not need to call the Kubernetes API.
  automountServiceAccountToken: false

config:
  # Route LLM traffic through the in-cluster Archestra Unified Model API.
  # IDs are provider-qualified and must match GET /v1/unified-model/models.
  providers:
    archestra:
      base_url: http://archestra-platform.archestra.svc.cluster.local:9000/v1/unified-model
      key_env: ARCHESTRA_API_KEY
      discover_models: true
  model:
    provider: archestra
    default: "deepseek:deepseek-flash"
  mcp_servers:
    # See INDIGO-CORE-1-APPS-WAVE-5-OBSIDIAN-MCP.md.
    obsidian:
      url: http://obsidian-mcp.obsidian-mcp.svc.cluster.local:8000/mcp
      headers:
        Authorization: "Bearer ${OBSIDIAN_MCP_TOKEN}"
      skip_preflight: true
    Fastmail MCP Michael:
      url: https://api.fastmail.com/mcp
      auth: oauth
  command_allowlist:
    - "mcp:obsidian/find_similar_notes_tool"
    - "mcp:obsidian/get_audit_log_tool"
    - "mcp:obsidian/get_backlinks_tool"
    - "mcp:obsidian/get_broken_links_tool"
    - "mcp:obsidian/get_link_graph_tool"
    - "mcp:obsidian/get_orphans_tool"
    - "mcp:obsidian/get_periodic_note_tool"
    - "mcp:obsidian/get_tasks_tool"
    - "mcp:obsidian/get_vault_conventions_tool"
    - "mcp:obsidian/get_vault_stats_tool"
    - "mcp:obsidian/lint_schema_tool"
    - "mcp:obsidian/list_all_tags_tool"
    - "mcp:obsidian/list_attachments_tool"
    - "mcp:obsidian/list_files_tool"
    - "mcp:obsidian/list_folder_tool"
    - "mcp:obsidian/list_notes_tool"
    - "mcp:obsidian/list_templates_tool"
    - "mcp:obsidian/list_vaults_tool"
    - "mcp:obsidian/query_notes_tool"
    - "mcp:obsidian/read_attachment_tool"
    - "mcp:obsidian/read_note_tool"
    - "mcp:obsidian/resolve_alias_tool"
    - "mcp:obsidian/search_notes_tool"
  terminal:
    backend: local
  agent:
    gateway_timeout: 1800
  approvals:
    mode: manual
    cron_mode: deny
    unattended_mode: deny
    single_query_mode: deny
    deny:
      - "rm -rf /"
      - "curl.*\\|.*sh"

# Ignored when externalSecret.enabled is true; kept empty to satisfy schema.
env: {}

extraEnv:
  - name: TZ
    value: Australia/Melbourne
  # Dashboard OIDC: issuer and scopes here; the client ID is injected from hermes-env.
  - name: HERMES_DASHBOARD_OIDC_ISSUER
    value: https://auth.indigo.dalmura.cloud/application/o/hermes/
  # offline_access is required for Authentik to issue a refresh token; without it the
  # access-token cookie expires after the provider TTL (~5 min) and the dashboard
  # bounces every user back through the login flow.
  - name: HERMES_DASHBOARD_OIDC_SCOPES
    value: openid profile email offline_access
  - name: XDG_CACHE_HOME
    value: /opt/data/cache
  - name: npm_config_cache
    value: /opt/data/.npm

externalSecret:
  enabled: true
  refreshInterval: 1h
  annotations:
    argocd.argoproj.io/sync-wave: "1"
  secretStoreRef:
    kind: SecretStore
    name: site
  target:
    name: hermes-env
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: ARCHESTRA_API_KEY
      remoteRef:
        key: wave-5/hermes/config
        property: ARCHESTRA_API_KEY
    # Used by Hermes internally for Skills Hub, update checks, doctor, and
    # private git clones. Tier-1 secrets are stripped from terminal subprocesses.
    - secretKey: GITHUB_TOKEN
      remoteRef:
        key: wave-5/hermes/config
        property: GITHUB_TOKEN
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_ID
      remoteRef:
        key: wave-5/hermes/config
        property: HERMES_DASHBOARD_OIDC_CLIENT_ID
    - secretKey: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
      remoteRef:
        key: wave-5/hermes/config
        property: HERMES_DASHBOARD_OIDC_CLIENT_SECRET
    - secretKey: SLACK_BOT_TOKEN
      remoteRef:
        key: wave-5/hermes/config
        property: SLACK_BOT_TOKEN
    - secretKey: SLACK_APP_TOKEN
      remoteRef:
        key: wave-5/hermes/config
        property: SLACK_APP_TOKEN
    - secretKey: SLACK_ALLOWED_USERS
      remoteRef:
        key: wave-5/hermes/config
        property: SLACK_ALLOWED_USERS
    # Default destination for cron results and proactive messages. The bot must
    # be invited to this channel; the ID is visible in the channel's details.
    - secretKey: SLACK_HOME_CHANNEL
      remoteRef:
        key: wave-5/hermes/config
        property: SLACK_HOME_CHANNEL
    # Optional human-readable label for the home channel.
    - secretKey: SLACK_HOME_CHANNEL_NAME
      remoteRef:
        key: wave-5/hermes/config
        property: SLACK_HOME_CHANNEL_NAME
    # Bearer token for the Obsidian MCP server. The value is owned by the
    # obsidian-mcp application, so the Hermes Vault policy also needs read on
    # site/data/wave-5/obsidian-mcp/config.
    - secretKey: OBSIDIAN_MCP_TOKEN
      remoteRef:
        key: wave-5/obsidian-mcp/config
        property: MCP_API_KEY
    # Home Assistant Long-Lived Access Token (HA profile -> Security ->
    # Long-lived access tokens). The pod env copy is not visible to profile
    # turns under the multiplexed gateway; seed-house-manager-hass copies it
    # into the house-manager profile's .env, which is the only place the
    # homeassistant plugin reads it.
    - secretKey: HASS_TOKEN
      remoteRef:
        key: wave-5/hermes/config
        property: HASS_TOKEN
    # Bearer token for the hermes-tasks MCP shim's mcp-proxy listener (port 8770).
    # Clients send it as `Authorization: Bearer <token>`. See
    # INDIGO-CORE-1-APPS-WAVE-5-HERMES.md.
    - secretKey: HERMES_TASKS_TOKEN
      remoteRef:
        key: wave-5/hermes/config
        property: HERMES_TASKS_TOKEN

persistence:
  enabled: true
  storageClass: cluster-regular
  size: 10Gi
  mountPath: /opt/data
  annotations:
    helm.sh/resource-policy: keep
    argocd.argoproj.io/sync-options: Delete=false

dashboard:
  enabled: true
  publicUrl: https://hermes.indigo.dalmura.cloud
  trustedProxies:
    - 10.244.0.0/16
  auth:
    # Authentik provider is Confidential: the client ID and client secret are injected
    # via ExternalSecret (HERMES_DASHBOARD_OIDC_CLIENT_ID / _CLIENT_SECRET).
    provider: external

service:
  enabled: true
  port: 9119

# Ingress is managed via overlay ingress.yaml for consistency with dal-indigo-core-1 patterns.
ingress:
  enabled: false

# CiliumNetworkPolicy is managed via overlay network-policy.yaml.
networkPolicy:
  enabled: false

podSecurityContext:
  runAsNonRoot: true
  runAsUser: 10000
  runAsGroup: 10000
  fsGroup: 10000
  seccompProfile:
    type: RuntimeDefault

securityContext:
  allowPrivilegeEscalation: false
  readOnlyRootFilesystem: true
  capabilities:
    drop:
      - ALL

# s6-overlay requires writable+executable /run; the agent and headless Chromium require /tmp and /dev/shm.
extraVolumes:
  - name: run-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 16Mi
  - name: tmp-tmpfs
    emptyDir:
      medium: Memory
      sizeLimit: 1Gi
  - name: shm
    emptyDir:
      medium: Memory
      sizeLimit: 1Gi
  # MCP shim that turns the API server into MCP tools (see extraContainers[mcp-tasks]).
  - name: hermes-tasks
    configMap:
      name: hermes-tasks

extraVolumeMounts:
  - name: run-tmpfs
    mountPath: /run
  - name: tmp-tmpfs
    mountPath: /tmp
  - name: shm
    mountPath: /dev/shm

# MCP tools for Hermes' kanban board: create_task, list_tasks, get_task,
# board_status and list_assignees. The shim is a stdio MCP server
# (overlays/hermes/configmap-hermes-tasks.yaml)
# that opens the profile's board at /opt/data/kanban.db directly, the same SQLite
# store the gateway's kanban tools and dispatcher use; mcp-proxy provides the HTTP
# transport, bearer token and CORS.
extraContainers:
  - name: mcp-tasks
    image: nousresearch/hermes-agent:v0.23.4
    imagePullPolicy: IfNotPresent
    command:
      - sh
      - -c
      - |
        set -eu
        uv_dir="$(ls -d /opt/hermes/tools/uv-*/ | sort -V | tail -1)"
        export HOME=/opt/data
        export UV_TOOL_DIR=/opt/data/.uv-tools
        export UV_CACHE_DIR=/opt/data/.uv-cache
        exec "${uv_dir}uvx" --from 'mcp-proxy==0.15.0' mcp-proxy \
          --host 0.0.0.0 \
          --port 8770 \
          --allowed-host ha-hooks.indigo.dalmura.cloud \
          --allowed-host ha-hooks.indigo.dalmura.cloud:443 \
          --allow-origin '*' \
          --pass-environment \
          -- /opt/hermes/.venv/bin/python /opt/mcp-tasks/server.py
    env:
      - name: TZ
        value: Australia/Melbourne
      # mcp-proxy's own inbound token for this listener. Clients send it as
      # `Authorization: Bearer <HERMES_TASKS_TOKEN>`.
      - name: MCP_PROXY_AUTH_TOKEN
        valueFrom:
          secretKeyRef:
            name: hermes-env
            key: HERMES_TASKS_TOKEN
      # Where kanban notifications land: the Slack home channel the gateway already
      # uses for cron/proactive posts. This is a channel id, not a credential; when
      # unset, created cards still run but post no completion ping. The kanban tools
      # need nothing else from this Secret — the board file is on the data volume.
      - name: SLACK_HOME_CHANNEL
        valueFrom:
          secretKeyRef:
            name: hermes-env
            key: SLACK_HOME_CHANNEL
            optional: true
    ports:
      - name: tasks
        containerPort: 8770
        protocol: TCP
    readinessProbe:
      tcpSocket:
        port: tasks
      initialDelaySeconds: 20
      periodSeconds: 10
      failureThreshold: 3
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    resources:
      requests:
        cpu: 50m
        memory: 256Mi
      limits:
        memory: 1Gi
    volumeMounts:
      # The board itself: hermes_cli.kanban_db reads /opt/data/kanban.db. Without
      # this mount the container gets the image's empty throwaway /opt/data
      # (declared VOLUME), so every call sees an empty board.
      - name: data
        mountPath: /opt/data
      - name: hermes-tasks
        mountPath: /opt/mcp-tasks
        readOnly: true
      - name: tmp-tmpfs
        mountPath: /tmp

# The image normally chowns HERMES_HOME to the gateway user as root before
# dropping privileges. The non-root podSecurityContext above skips that, and
# fsGroup only changes the group, so a fresh Longhorn volume leaves /opt/data
# owned by root. Hermes then refuses the home as an unsafe control path.
# Ownership of the volume root is therefore fixed here, as root, once per start.
extraInitContainers:
  - name: fix-data-ownership
    image: busybox:1.38
    command:
      - sh
      - -c
      - chown 10000:10000 /opt/data
    securityContext:
      runAsNonRoot: false
      runAsUser: 0
      runAsGroup: 0
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
    volumeMounts:
      - name: data
        mountPath: /opt/data
  # The gateway multiplexes every profile in one process
  # (gateway.multiplex_profiles is on by default and cannot be disabled), and a
  # profile turn resolves credentials only from its own <home>/.env — the pod
  # environment (`hermes-env` envFrom) never reaches get_secret() there. HASS_*
  # is wanted for the house-manager profile alone, so seed that profile's .env
  # from the Vault-backed Secret on every start; Vault stays the source of truth
  # and the other profiles (default, event-manager) keep no Home Assistant
  # credentials. Runs after fix-data-ownership so the volume is writable.
  - name: seed-house-manager-hass
    image: busybox:1.38
    command:
      - sh
      - -c
      - |
        set -eu
        profile_dir=/opt/data/profiles/house-manager
        env_file="$profile_dir/.env"
        if [ ! -d "$profile_dir" ]; then
          echo "house-manager profile absent; nothing to seed"
          exit 0
        fi
        tmp="$env_file.tmp"
        umask 007
        # Drop any previous HASS_TOKEN line and its placeholder comment, then
        # append the managed value so repeated starts stay idempotent.
        grep -vE '^(# )?HASS_TOKEN=' "$env_file" 2>/dev/null >"$tmp" || :
        printf 'HASS_TOKEN=%s\n' "$HASS_TOKEN" >>"$tmp"
        # HASS_URL is only needed here too; keep an operator-set value if present.
        if ! grep -q '^HASS_URL=' "$tmp"; then
          printf 'HASS_URL=%s\n' "$HASS_URL" >>"$tmp"
        fi
        mv "$tmp" "$env_file"
        chmod 660 "$env_file"
        echo "seeded HASS_TOKEN/HASS_URL into $env_file"
    env:
      - name: HASS_TOKEN
        valueFrom:
          secretKeyRef:
            name: hermes-env
            key: HASS_TOKEN
      - name: HASS_URL
        value: http://ha.home-assistant.svc.cluster.local:8080
    securityContext:
      allowPrivilegeEscalation: false
      readOnlyRootFilesystem: true
      capabilities:
        drop:
          - ALL
    volumeMounts:
      - name: data
        mountPath: /opt/data

resources:
  requests:
    cpu: 250m
    memory: 1Gi

deploymentAnnotations:
  reloader.stakater.com/auto: "true"
  argocd.argoproj.io/sync-wave: "2"

tests:
  enabled: true
