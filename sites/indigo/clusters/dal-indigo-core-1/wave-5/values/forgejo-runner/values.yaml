# Forgejo Runner with the runner-k8s-plugin Kubernetes backend.
#
# The plugin runs as a native sidecar next to the runner and creates one pod per
# job in the release namespace. See:
# https://git.erwanleboucher.dev/eleboucher/runner-k8s-plugin
#
# The runner UUID and runner token come from the `forgejo-runner-secrets` Secret
# managed by External Secrets (Vault path `site/wave-5/forgejo-runner/config`).
# They are the UUID and Token shown by Forgejo when the runner is created under
# Site administration -> Actions -> Runners -> Create new runner.

forgejo:
  url: "http://forgejo-http.forgejo.svc.cluster.local:3000"
  existingSecret: forgejo-runner-secrets
  secretKeys:
    token: token
    uuid: uuid

image:
  repository: data.forgejo.org/forgejo/runner
  tag: "13.2.0"

# The plugin image tag defaults to the chart appVersion (13.2.1).

serviceAccount:
  # Created in overlays/forgejo-runner/service-account.yaml so the Vault role
  # and the chart's RBAC both bind to the same account.
  create: false
  name: forgejo-runner-sa

rbac:
  # Role/RoleBinding for creating, watching and exec'ing into job pods in this namespace.
  create: true

resources:
  requests:
    cpu: 50m
    memory: 256Mi
  limits:
    memory: 1Gi

runnerConfig: |
  cache:
    enabled: true
    dir: /data/cache
    port: 8088
    proxy_port: 8089
  container:
    docker_host: "-"
    workdir_parent: shared/workdir
  host:
    workdir_parent: /data/act
  log:
    level: info
  plugins:
    k8s:
      address: "unix:///plugin/forgejo-runner-k8s.sock"
      options:
        namespace: forgejo-runner
        poll_timeout: 10m
        image_pull_policy: IfNotPresent
        labels: "app.kubernetes.io/name=forgejo-runner-job"
        # Defaults for containers that do not declare their own resources,
        # in particular service containers.
        resources: |
          requests:
            cpu: 50m
            memory: 128Mi
          limits:
            memory: 512Mi
  runner:
    capacity: 3
    # `ubuntu-24.04` describes the job environment; `indigo` identifies the
    # site so workflows can target it once other sites have runners too.
    labels:
      - ubuntu-24.04:k8s:///config/podspec-default.yaml
      - indigo:k8s:///config/podspec-default.yaml
    timeout: 3h
    shutdown_timeout: 3m

podSpecs:
  podspec-default.yaml: |
    automountServiceAccountToken: false
    # The Indigo worker pools are amd64 only (eq14 N150 and macmini2014 i7).
    # Keep job pods off the arm64 Raspberry Pi nodes.
    nodeSelector:
      kubernetes.io/arch: amd64
    containers:
      - name: main
        image: ghcr.io/bjw-s-labs/forgejo-runner:ubuntu-24.04
        imagePullPolicy: IfNotPresent
        env:
          - name: DEBIAN_FRONTEND
            value: noninteractive
        resources:
          requests:
            cpu: 100m
            memory: 512Mi
          limits:
            memory: 2Gi
    restartPolicy: Never
