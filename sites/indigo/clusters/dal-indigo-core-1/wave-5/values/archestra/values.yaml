fullnameOverride: archestra-platform

postgresql:
  # Disable bundled Bitnami PostgreSQL in favor of CloudNativePG
  enabled: false

archestra:
  replicaCount: 1

  # Disable internal probe pods that test default K8s NetworkPolicy
  networkPolicyProbe:
    enabled: false

  # Ingress is managed via overlay ingress.yaml for consistency with dal-indigo-core-1 patterns
  ingress:
    enabled: false

  # Trust the CloudNativePG self-signed CA for PostgreSQL TLS.
  # The OpenAPPA runtime (@archestra/openappa-rs, rustls + native-certs) verifies
  # the server chain against the native store. Mount the CNPG CA in the system CA
  # directory and point SSL_CERT_DIR at that directory: unlike SSL_CERT_FILE this
  # keeps the public roots (ca-certificates.crt) in the trust set.
  extraVolumes:
    - name: archestra-db-ca
      secret:
        secretName: archestra-db-ca
        items:
          - key: ca.crt
            path: archestra-db-ca.crt

  extraVolumeMounts:
    - name: archestra-db-ca
      mountPath: /etc/ssl/certs/archestra-db-ca.crt
      subPath: archestra-db-ca.crt
      readOnly: true

  # Auth secrets reference external secret created by External Secrets Operator
  authSecret:
    existingSecretName: archestra-auth
    existingSecretKey: auth-secret

  # Database and admin credentials injected from Kubernetes secrets
  envWithValueFrom:
    - name: ARCHESTRA_DATABASE_URL
      valueFrom:
        secretKeyRef:
          name: archestra-db-app
          key: uri
    - name: ARCHESTRA_AUTH_ADMIN_PASSWORD
      valueFrom:
        secretKeyRef:
          name: archestra-auth
          key: admin-password
          optional: true

  # Disable Helm pre-upgrade migration Job hook to prevent PreSync deadlock before CNPG database exists
  migrationJob:
    enabled: false

  # Code sandbox (Dagger engine) - disable for initial rollout
  codeRuntime:
    enabled: false

  resources:
    requests:
      cpu: 200m
      memory: 1Gi
    limits:
      cpu: "2"
      memory: 3Gi

  # Dedicated background worker deployment for processing jobs from the postgres queue
  worker:
    enabled: true
    replicaCount: 1
    resources:
      requests:
        cpu: 100m
        memory: 512Mi
      limits:
        cpu: "1"
        memory: 1536Mi

  env:
    ARCHESTRA_DATABASE_RUN_MIGRATIONS_ON_STARTUP: "true"
    ARCHESTRA_FRONTEND_URL: "https://archestra.indigo.dalmura.cloud"
    ARCHESTRA_API_BASE_URL: "https://archestra.indigo.dalmura.cloud"
    ARCHESTRA_TRUST_PROXY: "true"
    SSL_CERT_DIR: "/etc/ssl/certs"
    ARCHESTRA_HTTP_KEEP_ALIVE_TIMEOUT_MS: "300000"
    ARCHESTRA_AUTH_ADDITIONAL_TRUSTED_ORIGINS: "https://auth.indigo.dalmura.cloud"
