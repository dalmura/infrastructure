apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: hermes
  namespace: argocd
  finalizers:
    - resources-finalizer.argocd.argoproj.io
spec:
  project: default
  sources:
    - repoURL: https://jyje.github.io/hermes-agent-helm
      chart: hermes-agent
      targetRevision: 1.23.0
      helm:
        valueFiles:
          - $values/sites/indigo/clusters/dal-indigo-core-1/wave-5/values/hermes/values.yaml
    - repoURL: https://github.com/dalmura/infrastructure.git
      targetRevision: HEAD
      ref: values
    - repoURL: https://github.com/dalmura/infrastructure.git
      path: sites/indigo/clusters/dal-indigo-core-1/wave-5/overlays/hermes
      targetRevision: HEAD
  destination:
    namespace: hermes
    server: {{ .Values.spec.destination.server }}
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
  revisionHistoryLimit: 1
