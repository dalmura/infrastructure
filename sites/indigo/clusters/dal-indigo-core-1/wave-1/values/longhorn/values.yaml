---
persistence:
  defaultClass: false

preUpgradeChecker:
  jobEnabled: false
  upgradeVersionCheck: false

defaultSettings:
  allowCollectingLonghornUsageMetrics: false
  # Obsidian's CouchDB is scaled down for the 17:00 UTC backup window, so
  # Longhorn must attach the detached volume itself to run the recurring job.
  allowRecurringJobWhileVolumeDetached: "true"
  # Minutes before a backup is marked failed. 5 minutes isn't appropriate
  # for volumes over 100GB.
  backupExecutionTimeout: "30"
  # Replica rebuilds saturate the SATA SSD on talos-e8ff1ed8884b (30MB/s
  # sustained, ~350ms write latency). Rebuild one at a time per node.
  concurrentReplicaRebuildPerNodeLimit: "1"
  # Allow up to 30s of replica silence before marking it failed, so a slow
  # disk stall does not trigger an unnecessary rebuild (and more IO).
  engineReplicaTimeout: "30"
  concurrentBackupRestorePerNodeLimit: "2"
  concurrentAutomaticEngineUpgradePerNodeLimit: "1"
  replicaReplenishmentWaitInterval: "1200"
  upgradeChecker: false
  replicaAutoBalance: "best-effort"

defaultBackupStore:
  backupTarget: "s3://dal-site-backups@us-east-1/indigo/longhorn/"
  backupTargetCredentialSecret: aws-s3-credentials-secret
