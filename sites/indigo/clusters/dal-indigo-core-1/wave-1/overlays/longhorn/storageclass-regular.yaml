kind: StorageClass
apiVersion: storage.k8s.io/v1
metadata:
  name: cluster-regular
  annotations:
    # StorageClass parameters are immutable; Replace lets ArgoCD delete+recreate on change.
    argocd.argoproj.io/sync-options: Replace=true,Force=true
    storageclass.kubernetes.io/is-default-class: "true"
provisioner: driver.longhorn.io
allowVolumeExpansion: true
reclaimPolicy: Delete
volumeBindingMode: Immediate
parameters:
  numberOfReplicas: "2"
  staleReplicaTimeout: "30"
  dataLocality: "best-effort"
  fsType: ext4
  recurringJobSelector: '[{"name":"daily-default-backup", "isGroup":false}, {"name":"daily-filesystem-trim", "isGroup":false}]'
