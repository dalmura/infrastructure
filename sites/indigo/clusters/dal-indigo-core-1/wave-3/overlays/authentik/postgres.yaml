---
apiVersion: postgresql.cnpg.io/v1
kind: Cluster
metadata:
  name: authentik-db
spec:
  description: "Authentik DB"
  instances: 2

  enableSuperuserAccess: true

  primaryUpdateStrategy: unsupervised
  # Roll the primary via switchover: the promoted replica is already running the
  # new image, so there is no window without a writable primary.
  primaryUpdateMethod: switchover

  resources:
    requests:
      cpu: 100m
      memory: 384Mi

  imageCatalogRef:
    apiGroup: postgresql.cnpg.io
    kind: ClusterImageCatalog
    name: postgresql-minimal-trixie
    major: 18

  storage:
    storageClass: cluster-nobackup
    size: 20Gi

  plugins:
    - name: barman-cloud.cloudnative-pg.io
      isWALArchiver: true
      parameters:
        barmanObjectName: authentik-postgres

  postgresql:
    parameters:
      archive_timeout: "30min"
      max_connections: "300"
---
apiVersion: postgresql.cnpg.io/v1
kind: ScheduledBackup
metadata:
  name: authentik-db-backup
spec:
  cluster:
    name: authentik-db
  schedule: "0 0 16 * * *"
  backupOwnerReference: self
  method: plugin
  pluginConfiguration:
    name: barman-cloud.cloudnative-pg.io
